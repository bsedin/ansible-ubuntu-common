---
- name: Create swapfile
  ansible.builtin.shell: |
    test -e /swapfile || ( \
      fallocate -l {{ ubuntu_common_setup_swap_size }} /swapfile && \
      chmod 600 /swapfile && \
      mkswap /swapfile && \
      swapon /swapfile \
    )
  when: ubuntu_common_setup_swapfile | bool

- name: Add swapfile to fstab
  ansible.posix.mount:
    src: /swapfile
    path: none
    fstype: swap
    state: present
    opts: sw
  when: ubuntu_common_setup_swapfile | bool

- name: Configure swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_set: true
    state: present
    reload: true
